<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- fish body -->
  <ellipse cx="9.4" cy="13.4" rx="6.8" ry="5"/>
  <!-- forked tail -->
  <path d="M14.8 13.4 L20 9.2 L18.7 13.4 L20 18 Z"/>
  <!-- mouth slit -->
  <path d="M3 14 C3.9 15.1 5.4 15.2 6.3 14.3"/>
  <!-- eye -->
  <circle cx="6" cy="11.7" r="0.9" fill="currentColor" stroke="none"/>
  <!-- mallet striking the back -->
  <path d="M21 3.2 L15.4 7.9"/>
  <circle cx="14.3" cy="8.9" r="1.9"/>
  <!-- impact / 敲击 lines -->
  <path d="M10.4 6.6 C10.7 5.9 11.3 5.5 12 5.6"/>
  <path d="M8.6 7.6 C8.6 6.8 9 6.2 9.7 5.9"/>
</svg>
