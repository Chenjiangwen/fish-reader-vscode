<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EAD0"/>
      <stop offset="1" stop-color="#E7CF9F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#C96E3F"/>
      <stop offset="0.6" stop-color="#A4502A"/>
      <stop offset="1" stop-color="#7C3618"/>
    </linearGradient>
    <linearGradient id="mallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0BA82"/>
      <stop offset="1" stop-color="#A9742F"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="56" cy="108" rx="40" ry="7" fill="#5A2C16" opacity="0.16"/>

  <g stroke="#5A2C16" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail fin (forked) -->
    <path d="M78 72 L108 50 L100 72 L108 96 Z" fill="url(#wood)"/>
    <!-- dorsal fin -->
    <path d="M44 50 L57 36 L66 52 Z" fill="url(#wood)"/>
    <!-- belly fin -->
    <path d="M50 92 L58 104 L66 90 Z" fill="url(#wood)"/>
    <!-- fish body -->
    <ellipse cx="50" cy="72" rx="36" ry="26" fill="url(#wood)"/>
  </g>

  <!-- gill line -->
  <path d="M34 52 C28 62 28 82 34 92" fill="none" stroke="#5A2C16" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
  <!-- sheen -->
  <path d="M30 58 C36 50 46 47 56 49" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.22"/>

  <!-- mouth slit (the wooden-fish opening) -->
  <path d="M16 74 C20 80 28 81 33 77" fill="none" stroke="#3E1E0E" stroke-width="5" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="30" cy="64" r="5" fill="#3E1E0E"/>
  <circle cx="28.4" cy="62.4" r="1.6" fill="#FFFFFF"/>

  <!-- mallet striking the back -->
  <g stroke="#5A2C16" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <line x1="112" y1="16" x2="78" y2="44" stroke="url(#mallet)" stroke-width="7"/>
    <circle cx="74" cy="47" r="11" fill="url(#mallet)"/>
  </g>

  <!-- impact / 敲击 vibration lines at the strike point -->
  <g stroke="#9A4A22" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 34 C62 31 65 30 68 31"/>
    <path d="M53 38 C54 34 56 31 59 30"/>
    <path d="M48 44 C47 40 47 37 49 34"/>
  </g>
</svg>
